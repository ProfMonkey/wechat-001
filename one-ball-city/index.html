let randomSeed=1;
function reseed(seed){randomSeed=(seed>>>0)||1}function rand(){randomSeed=(Math.imul(randomSeed,1664525)+1013904223)>>>0;return randomSeed/4294967296}function rnd(a,b){return a+rand()*(b-a)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function lerp(a,b,t){return a+(b-a)*t}
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1800)}
function sfx(kind='hit'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;const m={shot:[290,65,.13,'sawtooth',.09],hit:[650,150,.07,'triangle',.045],split:[850,350,.18,'triangle',.095],boom:[140,36,.27,'sawtooth',.12],power:[380,55,.55,'sawtooth',.16],win:[440,980,.3,'triangle',.10],charge:[800,1200,.12,'sine',.06]}[kind]||[460,180,.07,'triangle',.04];const o=audio.createOscillator(),g=audio.createGain();o.type=m[3];o.frequency.setValueAtTime(m[0],t);o.frequency.exponentialRampToValueAtTime(Math.max(20,m[1]),t+m[2]);g.gain.setValueAtTime(m[4],t);g.gain.exponentialRampToValueAtTime(.001,t+m[2]);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+m[2]+.015)}catch(e){}}

function showModal(html){el('modal').innerHTML=html;el('modalWrap').classList.add('show')}

function format(n){return Math.round(n).toLocaleString('zh-CN')}

 if(stage===2&&r===5&&col===5)return 'bomb';if(stage===3&&r===3&&col===4)return 'shock';
 const t=rand(),lv=stage;if(t<.03+lv*.001)return 'core';if(t<.095+lv*.0015)return 'split';if(t<.19+lv*.002)return 'bomb';if(t<.245+lv*.002)return 'laser';if(t<.30+lv*.002)return 'shock';if(t<.42+lv*.001)return 'armor';return 'normal'}
function loadStage(level=1,demo=false){closeModal();S.stage=clamp(level,1,24);S.state=demo?T.demo:T.playing;S.demo=demo;S.tiles=[];S.balls=[];S.particles=[];S.rings=[];S.beams=[];S.texts=[];S.queue=[];S.power=0;S.shots=demo?9:level<6?4:5;S.score=0;S.combo=0;S.best=0;S.destroyed=0;S.total=0;S.shake=0;S.flash=0;S.lastHit=-20;S.run=0;S.slow=0;S.hitPause=0;S.waveCount=0;S.chainBudget=level===1?5:4;S.superUsedThisShot=false;S.shotsFired=0;S.fireClock=0;S.autoWin=false;S.aimX=210;S.aimY=260;S.wind=0;S.drag=false;S.shotMode='normal';
 reseed(demo?9969:1000+level*11317);
 const pattern=(level-1)%6;const rows=demo?9:level<5?7:level<13?8:9;const cols=10;
 for(let c=0;c<cols;c++){let h=rows; if(pattern===0)h=rows-(c%4===0?2:0);if(pattern===1)h=rows-(c%3===0?2:0);if(pattern===2)h=rows-(Math.abs(c-4.5)<2?0:2);if(pattern===3)h=rows-(c===4||c===5?2:0);if(pattern===4)h=rows-(c%2===0?1:0);if(pattern===5)h=rows-(c<3||c>6?2:0);
 for(let row=0;row<h;row++){if(level>6&&row<4&&rand()<.075)continue;const type=demo?['bomb','split','laser','shock','core'][Math.floor(rand()*5)]:tileType(S.tiles.length,row,c,level);const hp=type==='armor'?(level>=12?3:2):type==='core'?(level>=10?2:1):1;
 const x=18+c*38.7,y=116+row*34.5;S.tiles.push({x,y,w:34.5,h:30,type,hp,maxHp:hp,alive:true,tint:rand(),t:rand()*10});S.total++;
 }}
 if(!demo&&level===1){const origin=S.tiles.find(b=>Math.abs(b.x-(18+5*38.7))<2&&Math.abs(b.y-(116+6*34.5))<2);if(origin){origin.type='split';origin.hp=origin.maxHp=1}const top=S.tiles.find(b=>Math.abs(b.x-(18+5*38.7))<2&&Math.abs(b.y-(116+5*34.5))<2);if(top)top.type='bomb'}
 if(demo){for(const b of S.tiles){b.hp=1;b.maxHp=1}}
 el('stageTitle').textContent=demo?'狂欢实验 · 解压无限炮':`第 ${String(level).padStart(2,'0')} 关 · ${LEVELS[level-1]}`;
 el('statusText').textContent=demo?'不计成绩 · 特效全开':level%6===0?'击穿装甲，激活全屏连击':'瞄准特殊核心，制造连锁爆炸';el('tip').classList.remove('off');autoAim();
 el('shootBtn').textContent='🚀 一键开炮';updateHUD();toast(demo?'💥 狂欢训练！尽情制造烟花':'🎯 瞄准紫色/橙色核心，打出漂亮连击！')}
function autoAim(){
 // Look for the first hittable block along each straight launch ray.
 // Prioritize reachable chain-reaction cores, rather than blindly firing into empty gaps.
 let best=null;
 for(let ai=-60;ai<=60;ai++){
  const a=ai/60*1.09,vx=Math.sin(a),vy=-Math.cos(a);let hit=null,travel=0;
  for(let d=30;d<640;d+=8){const x=210+vx*d,y=679+vy*d;
   if(x<18||x>402||y<85)break;
   for(const t of S.tiles){if(!t.alive)continue;
    const xx=clamp(x,t.x,t.x+t.w),yy=clamp(y,t.y,t.y+t.h);
    if((x-xx)**2+(y-yy)**2<55){hit=t;travel=d;break}
   }if(hit)break}
  if(!hit)continue;
  const scores={split:140,bomb:130,core:125,laser:120,shock:115,normal:30,armor:4};
  const score=scores[hit.type]-(hit.hp-1)*35-Math.abs(a)*13+travel*.007;
  if(!best||score>best.score)best={a,score,hit};
 }
 if(!best)return false;
 const b=best.hit, distance=(679-(b.y+b.h/2))/Math.cos(best.a);
 S.aimX=clamp(210+Math.sin(best.a)*distance,15,405);
 S.aimY=clamp(b.y+b.h/2,90,641);
 return true
}
function updateHUD(){el('comboText').textContent=S.best;el('destroyText').textContent=(S.total?Math.round(100*S.destroyed/S.total):0)+'%';el('shotsText').textContent=S.shots;el('energyText').textContent=Math.round(S.power)+'%';el('energyFill').style.width=S.power+'%';const ready=S.power>=100&&!S.superUsedThisShot;el('powerBtn').disabled=!ready||S.state===T.won||S.state===T.lost;el('powerBtn').classList.toggle('ready',ready);el('powerBtn').textContent=ready?'⚡🔥 毁灭风暴 READY！点击引爆全城':S.superUsedThisShot?'⚡ 已释放风暴 · 下一次发射后可再次释放':'⚡ 连击蓄能中 · 击碎建筑解锁「毁灭风暴」';el('shootBtn').disabled=S.state===T.firing||S.state===T.won||S.state===T.lost;}
function fire(){if(S.state!==T.playing&&S.state!==T.demo)return;if(S.shots<=0)return;closeModal();el('tip').classList.add('off');const dx=S.aimX-210,dy=S.aimY-679;const angle=Math.atan2(dx,Math.max(35,-dy));const a=clamp(angle,-1.14,1.14),speed=575;
 S.balls.push(makeBall(210,679,Math.sin(a)*speed,-Math.cos(a)*speed,1,'main'));S.state=T.firing;S.shots--;S.shotsFired++;S.fireClock=S.run;S.chainBudget=S.stage===1?5:4;S.superUsedThisShot=false;S.combo=0;S.lastHit=-20;S.slow=0;S.hitPause=0;sfx('shot');vibe(12);burst(210,679,'#74eefe',23,140);addRing(210,679,'#8eefff',20,48,.3);updateHUD()}
function makeBall(x,y,vx,vy,scale=1,type='mini'){return{x,y,px:x,py:y,vx,vy,r:scale>0.9?7:scale>.7?5.5:4.4,life:0,bounces:0,damage:type==='main'?1:1,trail:[],type,glow:1}}
function burst(x,y,color,n=22,power=200){const cnt=S.perf?Math.min(n,52):Math.min(n,22);for(let i=0;i<cnt;i++){if(S.particles.length>(S.perf?350:155))S.particles.shift();const a=rnd(0,Math.PI*2),v=rnd(power*.25,power),life=rnd(.28,.95);S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,size:rnd(1.3,5),gravity:rnd(60,190),kind:rand()<.3?'spark':'shard',turn:rnd(0,6)})}}
function addRing(x,y,color,r=10,grow=160,life=.48){S.rings.push({x,y,r,grow,life,max:life,color})}function floater(x,y,t,color='#fff0a7',size=16){S.texts.push({x,y,text:t,color,size,life:.83,max:.83,vy:-72})}
function beam(x1,y1,x2,y2,color='#75f5ff',life=.26,width=7){S.beams.push({x1,y1,x2,y2,color,life,max:life,width})}

 // Queued chain reactions remain attached to the same round.
 for(let i=S.queue.length-1;i>=0;i--)if(S.queue[i].at<=S.run){const q=S.queue.splice(i,1)[0];q.fn()}

function openStages(){const tiles=Array.from({length:24},(_,i)=>`<button class="${i+1===S.stage?'sel':i+1<maxUnlocked?'done':''}" onclick="loadStage(${i+1})">${String(i+1).padStart(2,'0')}</button>`).join('');showModal(`<h2>🗺️ 24 场爆爽挑战</h2><p>每6关一种主题。可直接试玩任意关卡，通关后会记录进度。</p><div class="level-grid">${tiles}</div><div class="row"><button class="cta dark" onclick="closeModal()">返回游戏</button><button class="cta hot" onclick="loadStage(${S.stage},true)">🎆 爆爽训练</button></div><p class="tiny">经典90关旧版还保留在主页面「经典90关」中</p>`)}
function savePoster(){try{const out=document.createElement('canvas');out.width=720;out.height=1280;const c=out.getContext('2d');const grad=c.createLinearGradient(0,0,0,1280);grad.addColorStop(0,'#131944');grad.addColorStop(1,'#070c22');c.fillStyle=grad;c.fillRect(0,0,720,1280);c.fillStyle='#fff';c.textAlign='center';c.font='900 54px system-ui';c.fillText('💥 一球灭城',360,120);c.drawImage(C,38,158,644,1135);c.fillStyle='#070d22dd';c.fillRect(38,1085,644,175);c.fillStyle='#ffdf83';c.font='bold 52px system-ui';c.fillText(`${Math.round(100*S.destroyed/S.total)}% 毁灭 · ${S.best} 连击`,360,1160);c.fillStyle='#c8eaff';c.font='22px system-ui';c.fillText('ProfMonkey  ·  V10 爽感革命',360,1210);
 out.toBlob(blob=>{if(!blob){toast('当前浏览器暂不支持截图');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='一球灭城_爆破高光.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('📸 已生成爆破战绩图片')},'image/png')}catch(e){toast('该浏览器暂不支持截图')}}

el('soundBtn').textContent=muted?'🔇 静音':'🔊 音效';loadStage(1);requestAnimationFrame(loop);
