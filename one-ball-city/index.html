<script>

try{maxUnlocked=Math.min(24,Math.max(1,+(localStorage.getItem('pm_ob_v10_unlocked')||1)));bestComboAll=+(localStorage.getItem('pm_ob_v10_combo')||0);muted=localStorage.getItem('pm_ob_v10_muted')==='1'}catch(e){}
const T={playing:'playing',firing:'firing',won:'won',lost:'lost',demo:'demo'};

const LEVELS=['街区首撞','火花盛典','连锁反应','闪电游乐场','玻璃之城','激光扫射','重锤出击','霓虹雪崩','彩虹弹幕','核心爆破','磁暴夜空','大楼倒塌','装甲裂谷','星云能量','爆破专家','反应堆狂欢','一发清屏','末日霓虹','火力全开','连环爆裂','高楼风暴','超级奇点','百万连击','终极烟火'];
const CHAPTERS=['第一章 · 撞进城市','第二章 · 连锁坍塌','第三章 · 氮气狂飙','第四章 · 全城拆除'];
let randomSeed=1;
function reseed(seed){randomSeed=(seed>>>0)||1}function rand(){randomSeed=(Math.imul(randomSeed,1664525)+1013904223)>>>0;return randomSeed/4294967296}function rnd(a,b){return a+rand()*(b-a)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function lerp(a,b,t){return a+(b-a)*t}
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1800)}
function sfx(kind='hit'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;const m={shot:[290,65,.13,'sawtooth',.09],hit:[650,150,.07,'triangle',.045],split:[850,350,.18,'triangle',.095],boom:[140,36,.27,'sawtooth',.12],power:[380,55,.55,'sawtooth',.16],win:[440,980,.3,'triangle',.10],charge:[800,1200,.12,'sine',.06]}[kind]||[460,180,.07,'triangle',.04];const o=audio.createOscillator(),g=audio.createGain();o.type=m[3];o.frequency.setValueAtTime(m[0],t);o.frequency.exponentialRampToValueAtTime(Math.max(20,m[1]),t+m[2]);g.gain.setValueAtTime(m[4],t);g.gain.exponentialRampToValueAtTime(.001,t+m[2]);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+m[2]+.015)}catch(e){}}
function vibe(x=13){if(navigator.vibrate&&!muted)try{navigator.vibrate(x)}catch(e){}}
function showModal(html){el('modal').innerHTML=html;el('modalWrap').classList.add('show')}
function closeModal(){el('modalWrap').classList.remove('show')}
function format(n){return Math.round(n).toLocaleString('zh-CN')}
function tileType(i,r,col,stage){if(stage===1){if(r===6&&[4,5].includes(col))return 'split';if(r===5&&[4,5,6].includes(col))return 'bomb';if(r===4&&col===5)return 'laser';if(r===3&&[4,5].includes(col))return 'shock';}
 if(stage===2&&r===5&&col===5)return 'bomb';if(stage===3&&r===3&&col===4)return 'shock';
 const t=rand(),lv=stage;if(t<.03+lv*.001)return 'core';if(t<.095+lv*.0015)return 'split';if(t<.19+lv*.002)return 'bomb';if(t<.245+lv*.002)return 'laser';if(t<.30+lv*.002)return 'shock';if(t<.42+lv*.001)return 'armor';return 'normal'}
function loadStage(level=1,demo=false){closeModal();S.stage=clamp(level,1,24);S.buildings=[];S.state=demo?T.demo:T.playing;S.demo=demo;S.tiles=[];S.balls=[];S.particles=[];S.rings=[];S.beams=[];S.texts=[];S.queue=[];S.power=0;S.shots=demo?9:level<6?4:5;S.score=0;S.combo=0;S.best=0;S.destroyed=0;S.total=0;S.shake=0;S.flash=0;S.lastHit=-20;S.run=0;S.slow=0;S.hitPause=0;S.waveCount=0;S.chainBudget=level===1?5:4;S.superUsedThisShot=false;S.shotsFired=0;S.fireClock=0;S.autoWin=false;S.aimX=210;S.aimY=260;S.wind=0;S.drag=false;S.shotMode='normal';
 reseed(demo?9969:1000+level*11317);
 const pattern=(level-1)%6; const cols=10;const blockH=34.5,baseY=482;
 // Five continuous multi-storey buildings. Each collision tile is a physical floor section,
 // but their shared facades, roofs and signage form recognisable architecture.
 const styles=['brick','glass','hotel','office','factory'];
 const labels=['工厂','中央大厦','酒店','金融中心','科研楼'];
 for(let group=0;group<5;group++){
   const tall=[7,8,9,7,8][group];const variance=((level+group*3)%4===0?-1:0);
   const floors=demo?8:clamp(tall+variance+(level>10&&group===2?1:0),6,9);
   const x=18+group*2*38.7,top=baseY-floors*blockH;
   S.buildings.push({id:group,x,top,w:73.2,h:floors*blockH,floors,style:styles[(group+Math.floor((level-1)/6))%5],label:labels[group],falling:false,glow:rnd(0,6)});
   for(let row=0;row<floors;row++)for(let half=0;half<2;half++){
      if(level>14&&row<3&&rand()<.045)continue;
      const col=group*2+half;
      let type=demo?['bomb','split','laser','shock','core'][Math.floor(rand()*5)]:tileType(S.tiles.length,row,col,level);
      // Ground-floor weak points are readable, so crashing through the base is tactical.
      if(row===floors-1&&half===1&&group===2&&level===1)type='split';
      if(row===floors-2&&half===1&&group===2&&level===1)type='bomb';
      const hp=type==='armor'?(level>=12?3:2):type==='core'?(level>=10?2:1):1;
      S.tiles.push({x:x+half*38.7,y:top+row*blockH,w:34.5,h:30.5,type,hp,maxHp:hp,alive:true,tint:rand(),t:rand()*10,buildingId:group,row,floors});S.total++;
   }
 }
 if(demo){for(const b of S.tiles){b.hp=1;b.maxHp=1}}
 el('stageTitle').textContent=demo?'城市狂飙 · 赛车无限冲撞':`第 ${String(level).padStart(2,'0')} 关 · ${LEVELS[level-1]}`;
 el('statusText').textContent=demo?'不计成绩 · 氮气特效全开':level%6===0?'撞开结构层，触发连锁坍塌':'瞄准建筑底部的橙色弱点！';el('tip').classList.remove('off');autoAim();
 el('shootBtn').textContent='🚘 一键出车';updateHUD();toast(demo?'🏁 城市狂飙！撞到哪儿炸到哪儿！':'🚘 撞穿大楼底层，整栋楼才会坍塌！')}
function autoAim(){
 // Look for the first hittable block along each straight launch ray.
 // Prioritize reachable chain-reaction cores, rather than blindly firing into empty gaps.
 let best=null;
 for(let ai=-60;ai<=60;ai++){
  const a=ai/60*1.09,vx=Math.sin(a),vy=-Math.cos(a);let hit=null,travel=0;
  for(let d=30;d<640;d+=8){const x=210+vx*d,y=679+vy*d;
   if(x<18||x>402||y<85)break;
   for(const t of S.tiles){if(!t.alive)continue;
    const xx=clamp(x,t.x,t.x+t.w),yy=clamp(y,t.y,t.y+t.h);
    if((x-xx)**2+(y-yy)**2<55){hit=t;travel=d;break}
   }if(hit)break}
  if(!hit)continue;
  const scores={split:140,bomb:130,core:125,laser:120,shock:115,normal:30,armor:4};
  const score=scores[hit.type]-(hit.hp-1)*35-Math.abs(a)*13+travel*.007;
  if(!best||score>best.score)best={a,score,hit};
 }
 if(!best)return false;
 const b=best.hit, distance=(679-(b.y+b.h/2))/Math.cos(best.a);
 S.aimX=clamp(210+Math.sin(best.a)*distance,15,405);
 S.aimY=clamp(b.y+b.h/2,90,641);
 return true
}
function updateHUD(){el('comboText').textContent=S.best;el('destroyText').textContent=(S.total?Math.round(100*S.destroyed/S.total):0)+'%';el('shotsText').textContent=S.shots;el('energyText').textContent=Math.round(S.power)+'%';el('energyFill').style.width=S.power+'%';const ready=S.power>=100&&!S.superUsedThisShot;el('powerBtn').disabled=!ready||S.state===T.won||S.state===T.lost;el('powerBtn').classList.toggle('ready',ready);el('powerBtn').textContent=ready?'🔥🚘 氮气风暴就绪！点击全城冲撞':S.superUsedThisShot?'🔥 氮气已释放 · 下一辆车可再次充能':'🔥 氮气蓄能中 · 撞毁建筑解锁「超级冲撞」';el('shootBtn').disabled=S.state===T.firing||S.state===T.won||S.state===T.lost;}
function fire(){if(S.state!==T.playing&&S.state!==T.demo)return;if(S.shots<=0)return;closeModal();el('tip').classList.add('off');const dx=S.aimX-210,dy=S.aimY-679;const angle=Math.atan2(dx,Math.max(35,-dy));const a=clamp(angle,-1.14,1.14),speed=575;
 S.balls.push(makeBall(210,679,Math.sin(a)*speed,-Math.cos(a)*speed,1,'main'));S.state=T.firing;S.shots--;S.shotsFired++;S.fireClock=S.run;S.chainBudget=S.stage===1?5:4;S.superUsedThisShot=false;S.combo=0;S.lastHit=-20;S.slow=0;S.hitPause=0;sfx('shot');vibe(22);burst(210,679,'#ffb15d',25,145);addRing(210,679,'#ffb55e',20,48,.3);updateHUD()}
function makeBall(x,y,vx,vy,scale=1,type='mini'){return{x,y,px:x,py:y,vx,vy,r:scale>0.9?8.4:scale>.7?6.3:5.5,life:0,bounces:0,damage:type==='main'?1:1,trail:[],type,glow:1}}
function burst(x,y,color,n=22,power=200){const cnt=S.perf?Math.min(n,52):Math.min(n,22);for(let i=0;i<cnt;i++){if(S.particles.length>(S.perf?350:155))S.particles.shift();const a=rnd(0,Math.PI*2),v=rnd(power*.25,power),life=rnd(.28,.95);S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,size:rnd(1.3,5),gravity:rnd(60,190),kind:rand()<.3?'spark':'shard',turn:rnd(0,6)})}}
function addRing(x,y,color,r=10,grow=160,life=.48){S.rings.push({x,y,r,grow,life,max:life,color})}function floater(x,y,t,color='#fff0a7',size=16){S.texts.push({x,y,text:t,color,size,life:.83,max:.83,vy:-72})}
function beam(x1,y1,x2,y2,color='#75f5ff',life=.26,width=7){S.beams.push({x1,y1,x2,y2,color,life,max:life,width})}

 if(!parked){ctx.shadowBlur=12;ctx.shadowColor='#ffb442';ctx.fillStyle='#ffe28e';const t=runTime*22+b.life*11;ctx.beginPath();ctx.moveTo(-3,12);ctx.lineTo(-1,18+Math.sin(t)*4);ctx.lineTo(0,12);ctx.lineTo(1,18+Math.cos(t)*4);ctx.lineTo(3,12);ctx.fill()}
 ctx.restore();
}
function drawAim(){if(S.state!==T.playing&&S.state!==T.demo)return;let dx=S.aimX-210,dy=S.aimY-679,angle=clamp(Math.atan2(dx,Math.max(35,-dy)),-1.14,1.14);let vx=Math.sin(angle),vy=-Math.cos(angle),x=210,y=673;ctx.save();ctx.setLineDash([8,11]);ctx.strokeStyle='#ffd08aaa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<76;i++){x+=vx*7;y+=vy*7;if(x<18){x=18;vx*=-1}if(x>W-18){x=W-18;vx*=-1}if(y<85)break;ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#fff3d2cc';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.stroke();ctx.restore()}

 // Roadside starting grid, with an actual car waiting to launch.
 ctx.save();ctx.fillStyle='#342821';ctx.fillRect(180,665,60,44);ctx.fillStyle='#ffc78266';ctx.fillRect(180,665,60,3);

function drawBgraffiti(){ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#ffe0a5';ctx.font='bold 58px system-ui';ctx.textAlign='center';ctx.fillText('CAR CRASH',210,73);ctx.restore()}
function drawEffects(){for(const r of S.rings){ctx.save();ctx.strokeStyle=r.color;ctx.globalAlpha=Math.pow(r.life/r.max,1.4);ctx.lineWidth=4*(r.life/r.max);ctx.shadowBlur=20;ctx.shadowColor=r.color;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
 for(const l of S.beams){ctx.save();ctx.globalAlpha=l.life/l.max;ctx.strokeStyle=l.color;ctx.lineWidth=l.width+Math.random()*2;ctx.shadowBlur=23;ctx.shadowColor=l.color;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
 for(const p of S.particles){const alpha=p.life/p.max;ctx.globalAlpha=alpha;ctx.fillStyle=p.color;if(p.kind==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.turn+p.life*5);ctx.fillRect(-p.size/2,-p.size/2,p.size*1.9,p.size*.7);ctx.restore()}else{ctx.fillRect(p.x,p.y,p.size,p.size)}}ctx.globalAlpha=1;
 for(const b of S.balls){for(let i=1;i<b.trail.length;i++){const t=b.trail[i],alpha=(i/b.trail.length)*.36;
 ctx.fillStyle=`rgba(255,168,67,${alpha})`;ctx.beginPath();ctx.arc(t[0],t[1],Math.max(2,b.r*i/b.trail.length),0,Math.PI*2);ctx.fill()}
 drawCar(b);
 }
 for(const t of S.texts){ctx.save();ctx.globalAlpha=clamp(t.life/t.max,0,1);ctx.textAlign='center';ctx.shadowBlur=17;ctx.shadowColor=t.color;ctx.font=`1000 ${t.size}px system-ui`;ctx.lineWidth=4;ctx.strokeStyle='#1c143b';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore()}
 if(S.flash>0){ctx.fillStyle=`rgba(255,224,234,${Math.min(.48,S.flash*.5)})`;ctx.fillRect(0,0,W,H)} }
function draw(){ctx.save();if(S.shake>0){ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake)}drawBg();drawBgraffiti();ctx.save();ctx.shadowColor='#ffb74a33';ctx.shadowBlur=19;drawCityBuildings();ctx.restore();drawAim();drawCannon();drawEffects();
 ctx.fillStyle='#2a1810df';rounded(10,13,150,34,12);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#fff4bd';ctx.font='bold 16px system-ui';ctx.fillText('🔥 '+S.combo+' HIT',21,36);ctx.textAlign='right';ctx.fillStyle='#ffcb88';ctx.fillText(format(S.score)+' 分',402,36);
 ctx.fillStyle='#ffddbb';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(S.demo?'FREE DRIVE · 城市冲撞':`${CHAPTERS[Math.floor((S.stage-1)/6)]} · 目标 ${S.stage<=3?'58':S.stage<=10?'66':'72'}%`,210,101);
 ctx.restore()}
function loop(time){const raw=clamp((time-lastFrame)/1000,0,.033);lastFrame=time;try{tick(raw);draw()}catch(err){console.error('飞车拆城运行异常',err);toast('运行发生异常：请刷新网页')}requestAnimationFrame(loop)}
function toAim(e){const rect=C.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;S.aimX=clamp(x,15,405);S.aimY=clamp(y,90,641)}
C.addEventListener('pointerdown',e=>{if(S.state!==T.playing&&S.state!==T.demo)return;e.preventDefault();toAim(e);S.drag=true;C.setPointerCapture(e.pointerId)});
C.addEventListener('pointermove',e=>{if(!S.drag)return;e.preventDefault();toAim(e)});
C.addEventListener('pointerup',e=>{if(!S.drag)return;e.preventDefault();toAim(e);S.drag=false;fire()});C.addEventListener('pointercancel',()=>S.drag=false);

el('helpBtn').addEventListener('click',()=>{showModal(`<div class="big">🚘</div><h2>3 秒上手，赛车撞楼！</h2><p style="text-align:left">🚘 <b>拖动选撞击角度，松手出车</b>；也能直接点「一键出车」。<br>🟠 <b>橙色弱点</b> → 撞断两侧底层，整栋楼层层坍塌。<br>💥 <b>爆破油桶</b> → 周边建筑连锁引爆。<br>⚙️ <b>特殊设施</b> → 裂变赛车、激光扫射。<br>⚡ <b>电力核心</b> → 传导更多建筑。<br>🌟 <b>金色能源</b> → 超大范围建筑爆破。<br>🔥 <b>越撞越强</b>，氮气满100%后，点击「超级冲撞」，主动引爆街区。</p><div class="row"><button class="cta hot" onclick="closeModal()">🚘 直接撞楼</button><button class="cta dark" onclick="closeModal();el('demoBtn').click()">🏁 先看飞车狂飙</button></div>`) });

function savePoster(){try{const out=document.createElement('canvas');out.width=720;out.height=1280;const c=out.getContext('2d');const grad=c.createLinearGradient(0,0,0,1280);grad.addColorStop(0,'#131944');grad.addColorStop(1,'#070c22');c.fillStyle=grad;c.fillRect(0,0,720,1280);c.fillStyle='#fff';c.textAlign='center';c.font='900 54px system-ui';c.fillText('🚘 飞车拆城',360,120);c.drawImage(C,38,158,644,1135);c.fillStyle='#070d22dd';c.fillRect(38,1085,644,175);c.fillStyle='#ffdf83';c.font='bold 52px system-ui';c.fillText(`${Math.round(100*S.destroyed/S.total)}% 毁灭 · ${S.best} 连击`,360,1160);c.fillStyle='#c8eaff';c.font='22px system-ui';c.fillText('ProfMonkey  ·  V11 狂飙崩塌',360,1210);
 out.toBlob(blob=>{if(!blob){toast('当前浏览器暂不支持截图');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='飞车拆城_赛车撞楼高光.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('📸 已生成爆破战绩图片')},'image/png')}catch(e){toast('该浏览器暂不支持截图')}}
